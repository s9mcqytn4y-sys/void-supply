name: Staging Scheduled Maintenance (Expiry & Outbox Cron)

on:
  schedule:
    # Eksekusi terjadwal setiap 5 menit (interval minimum GitHub Actions gratis)
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: "Picu eksekusi pembersihan pesanan kedaluwarsa & pemrosesan antrean outbox secara manual"
        required: false
        default: "true"

jobs:
  maintenance-cron:
    name: Eksekusi Cron Pemeliharaan Staging
    runs-on: ubuntu-latest
    steps:
      - name: Validasi Secrets & Parameter Wajib
        id: validate
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET wajib dikonfigurasi pada GitHub Repository Secrets."
            exit 1
          fi

          TARGET_URL="${STAGING_APP_URL:-https://void-supply-lemon.vercel.app}"
          CLEAN_BASE_URL="${TARGET_URL%/}"
          echo "BASE_URL=$CLEAN_BASE_URL" >> "$GITHUB_ENV"
          echo "Target Base URL dikonfigurasi ke: $CLEAN_BASE_URL"

      - name: Eksekusi API Cron Kadaluwarsa Pesanan (Reservasi 15 Menit)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${BASE_URL}/api/cron/kadaluwarsa-pesanan"
          echo "Memanggil endpoint kadaluwarsa pesanan: $TARGET_URL"

          curl --fail-with-body \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 3 \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "User-Agent: VOID-Supply-GitHub-Actions-Cron/1.0" \
            "$TARGET_URL"

      - name: Eksekusi API Cron Worker Outbox (Email & Fulfillment)
        if: always() && steps.validate.outcome == 'success'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${BASE_URL}/api/cron/proses-outbox"
          echo "Memanggil endpoint worker transactional outbox: $TARGET_URL"

          curl --fail-with-body \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 3 \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "User-Agent: VOID-Supply-GitHub-Actions-Cron/1.0" \
            "$TARGET_URL"
