<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 80" fill="none" width="180" height="80">
  <!-- FIDLOCK Magnetic Hardware Vector Badge -->
  <rect x="1" y="1" width="178" height="78" stroke="#3f3f46" stroke-width="1.5" fill="#09090b" />
  
  <!-- Hardware Buckle Schematic -->
  <rect x="12" y="24" width="28" height="32" rx="2" stroke="#ffffff" stroke-width="1.5" fill="#18181b" />
  <rect x="18" y="30" width="16" height="20" stroke="#71717a" stroke-width="1" fill="#09090b" />
  <line x1="26" y1="20" x2="26" y2="24" stroke="#ffffff" stroke-width="2" />
  <line x1="26" y1="56" x2="26" y2="60" stroke="#ffffff" stroke-width="2" />
  <circle cx="26" cy="40" r="2.5" fill="#38bdf8" />
  
  <!-- Typography & Specs -->
  <text x="50" y="28" fill="#ffffff" font-family="monospace" font-size="11" font-weight="800" letter-spacing="1.5">
    MAGNETIC BUCKLE
  </text>
  <text x="50" y="44" fill="#a1a1aa" font-family="monospace" font-size="9" font-weight="600" letter-spacing="0.5">
    QUICK-RELEASE LOCK
  </text>
  <text x="50" y="58" fill="#71717a" font-family="monospace" font-size="8" font-weight="500" letter-spacing="1">
    AEROSPACE GRADE ALUMINUM
  </text>
  
  <!-- Corner Accent Lines -->
  <line x1="1" y1="1" x2="12" y2="1" stroke="#ffffff" stroke-width="2" />
  <line x1="1" y1="1" x2="1" y2="12" stroke="#ffffff" stroke-width="2" />
</svg>
